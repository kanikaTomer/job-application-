<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>job application </title>
</head>
<body>
    <h1>Job Application</h1>


     <form action="application.html ">
        <label for="firstname "> first name  </label><br>
        <input type = "text" name ="first name " > <br>

        <label for="middlename "> middle name  </label><br>
        <input type = "text" name ="middle name "> <br>

        <label for="lastname "> last name  </label><br>
        <input type = "text" name ="last name " > 
        
        <br>

         <label for= "age">age</label>
         <input type = "number" min ="0" max ="120">

        <label for ="gender">gender:</label>
        <select id = "gender" name = "gender">
        <option value ="male">male</option>
        <option value ="female">female</option>
        <option value ="other">other</option>
        </select>

        <br>

        <label for= "address">address</label>
        <textarea name = "address" id="address">

        </textarea>
        
        <br>
        <h2> Education</h2>

        <label for ="qualification">qualification:</label>
        <input type ="text" id ="qualification"name ="qualification"> 
        <br>
        <label for ="college">college name:</label>
        <input type ="text" id ="college " name ="college">
        <br>
        <label for ="branch">branch:</label>
        <input type ="text" id = "college" name ="branch">
        <br>

        <h2>work experience</h2>
        <label for ="experience">year of experience:</label>
        <input type ="text" id="experience" name ="experience">

        <br>

        <label for = "industry">industry:</label>
        <input type = "text" id = "industry" name = "industry">

        <br>
        <h2>Skills</h2>
        <label for ="skills">add your skills:</label>
        <textarea name = "skills" id="skills">

        </textarea>

        <br>
        <label for ="cv">upload your cv-pdf only </label>
        <input type ="file" accept = "applicationpdf, .pdf">



        <button types ="submit">Submit</button> 

         </form>
